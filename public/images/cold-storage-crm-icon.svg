<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cold Storage CRM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#0b6bcb"/>
      <stop offset="1" stop-color="#071a33"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>
  <!-- Bold snowflake (six identical arms) so it stays readable at 16px -->
  <g fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <g id="arm"><path d="M32 32V11M26 15.5 32 21l6-5.5"/></g>
    <use href="#arm" transform="rotate(60 32 32)"/>
    <use href="#arm" transform="rotate(120 32 32)"/>
    <use href="#arm" transform="rotate(180 32 32)"/>
    <use href="#arm" transform="rotate(240 32 32)"/>
    <use href="#arm" transform="rotate(300 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="4.2" fill="#ffffff"/>
</svg>
