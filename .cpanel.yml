---
deployment:
  tasks:
    # CRM lives at public_html/app.evergreencold.store (cPanel user: techshakerco99).
    # Git Version Control clone path should be that directory.
    - export APP_DIR="/home/techshakerco99/public_html/app.evergreencold.store"
    - export PHP_BIN="/opt/cpanel/ea-php84/root/usr/bin/php"
    - export COMPOSER_BIN="/home/techshakerco99/composer.phar"
    - |
      if [ -f "$COMPOSER_BIN" ]; then
        "$PHP_BIN" "$COMPOSER_BIN" install --working-dir="$APP_DIR" --no-dev --optimize-autoloader --no-interaction
      fi
    - "$PHP_BIN" "$APP_DIR/artisan" migrate --force
    - "$PHP_BIN" "$APP_DIR/artisan" storage:link 2>/dev/null || true
    - "$PHP_BIN" "$APP_DIR/artisan" optimize:clear
    - "$PHP_BIN" "$APP_DIR/artisan" config:cache
    - "$PHP_BIN" "$APP_DIR/artisan" route:cache
    - "$PHP_BIN" "$APP_DIR/artisan" view:cache
